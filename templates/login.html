<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles_v2.css') }}">

</head>

<body>
    <div class="container">
        <h2>Login</h2>
        <div class="userloginType">
            <button id="studentButton" class="userTypeButton">Student</button>
            <button id="teacherButton" class="userTypeButton">Teacher</button>
        </div>
        <form id="loginForm">
            <div id="loginFields">
                <label for="loginUserID">Roll No:</label>
                <input type="number" id="loginUserID" name="loginUserID" required><br>
                <label for="loginPassword">Password:</label>
                <input type="password" id="loginPassword" name="loginPassword" required><br>
            </div>
            <button type="button" class="submit" onclick="login()">Login</button>
        </form>
        <h2>Register</h2>
        <div class="userregisterType">
            <button id="registerStudentButton" class="userTypeButton">As a Student</button>
            <button id="registerTeacherButton" class="userTypeButton">As a Teacher</button>
        </div>
        <form id="registerForm" class="hidden">
            <div id="registerFields">
            </div>
            <button type="button" class="submit" onclick="register()">Register</button>
        </form>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
