{% block createCourse %}
        
<div class="addclassform hidden" id="addclassform">
    <div class="form">
        <div class="addClassFormHeader">
            <h2>Add Class</h2>
            <button id="cross" class="cross"><img src="{{ url_for('static', filename='img/cross(cancel).svg') }}"></button>
        </div>
        <form id="addClassForm">
            <div id="registerFields">
                <label for="course_name">Course:</label>
                <input type="text" id="course_name" name="course_name" required>
                <label for="course_id">Course ID:</label>
                <input type="text" id="course_id" name="course_id" required>
                <label for="group_id">Group ID:</label>
                <input type="text" id="group_id" name="group_id" required>
            </div>
            <button type="button" id="cancel" class="addClassbtn">Cancel</button>
            <button type="submit" class="submit addClassbtn">Add</button>
        </form>
    </div>        
</div>
<script src="{{ url_for('static', filename='js/student_dashboard_script.js') }}"></script>
    {% endblock createCourse %}
