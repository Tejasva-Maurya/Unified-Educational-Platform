<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Selection</title>
</head>

<body>

    <h2>Select Course and Group IDs</h2>

    <div id="courseList">
        <!-- Dynamic content will be inserted here -->
    </div>

    <button id="submitSelection">Submit</button>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Fetch courses and group IDs from the server
            fetch('/courses')
                .then(response => response.json())
                .then(data => {
                    let coursesHTML = '';
                    data.forEach(course => {
                        coursesHTML += `
                <h3>${course.name}</h3>
                <ul>
            `;
                        course.group_ids.forEach(groupId => {
                            coursesHTML += `
                    <li>
                        <input type="checkbox" name="groupIds" value="${groupId}">${groupId}
                    </li>
                `;
                        });
                        coursesHTML += `</ul>`;
                    });
                    document.getElementById("courseList").innerHTML = coursesHTML;
                })
                .catch(error => console.error('Error fetching courses:', error));
        });

        document.getElementById("submitSelection").addEventListener("click", function () {
            const selectedCourse = document.querySelector('input[name="course"]:checked').value;
            const selectedGroupIds = Array.from(document.querySelectorAll('input[name="groupIds"]:checked')).map(input => input.value);

            // Send the selected course and group IDs to the parent window
            window.opener.postMessage({ course: selectedCourse, groupIds: selectedGroupIds }, window.location.origin);
        });
    </script>

</body>

</html>
