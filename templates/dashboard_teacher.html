{% extends "dashboard_base.html" %}

{% block classContainer %}
            <div class="classContainer" id = "classContainer">
                    <script>
                        const BASE_URL = "{{ url_for('static', filename='') }}";
                    </script>  
            </div>
{% endblock classContainer %}


{% block contentContainer %}
            <div class="" id = "cardContainer">

            </div>
    <script src="{{ url_for('static', filename='js/teacher_dashboard_class_container_v2.js') }}"></script>

{% endblock contentContainer %}



{% block createCourse %}
        
    <div class="createCourseForm hidden" id = "createCourse">
        <div class="createCourseFormHeader">
            <h2>Add Course</h2>
            <button id="cross" class="cross"><img src="{{ url_for('static', filename='img/cross(cancel).svg') }}"></button>
        </div>
        <form id="createCourseForm">
            <div id="newCourseFields">
                <label for="course_name">Course Name:</label><br>
                <input type="text" id="course_name" name="course_name" required>
                <label for="course_id">Course(code):</label><br>
                <input type="text" id="course_id" name="course_id" required>
                <label for="group_id">Group ID:</label><br>
                <input type="text" id="group_id" name="group_id" required>
            </div>
            <button type="button" id="cancel" class="createCourseBtn">Cancel</button>
            <button type="submit" class="submit createCourseBtn">Create</button>
        </form>
    </div>
    <script src="{{ url_for('static', filename='js/teacher_dashboard_script_v2.js') }}"></script>
    {% endblock createCourse %}
